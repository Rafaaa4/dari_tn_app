name: dari_app
description: Dari.tn — Application de location immobilière Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0



  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0

  # Security local storage
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # HTTP for future backend/payment
  dio: ^5.6.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
